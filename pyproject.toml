[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ordal"
version = "0.13.0"
description = "Domain-agnostic adaptive experimentation framework: experiment → measure → learn → challenge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]

[project.scripts]
ordal = "ordal.cli:main"

[project.urls]
Homepage = "https://github.com/imaknas/ordal"
Repository = "https://github.com/imaknas/ordal"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "statsmodels>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
